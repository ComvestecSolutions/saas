name: Pull Request Assignment

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  issues: write

jobs:
  assign-pr-author:
    name: Assign Pull Request Author
    runs-on: ubuntu-latest
    steps:
      - name: Assign Pull Request Author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/assignees/${PR_AUTHOR}" \
            > /dev/null 2>&1; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/issues/${PR_NUMBER}/assignees" \
              -f "assignees[]=${PR_AUTHOR}"

            echo "Assigned ${PR_AUTHOR} to pull request #${PR_NUMBER}."
          else
            echo "Skipping auto-assignment because ${PR_AUTHOR} is not assignable in ${REPOSITORY}."
          fi
