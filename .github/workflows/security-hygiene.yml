name: Security Hygiene

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run Bun Audit
        run: bun audit

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose Configuration
        run: docker compose -f ops/docker/compose.yml config

  trivy-repository-scan:
    name: Trivy Repository Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"

  infrastructure-image-review:
    name: Infrastructure Image CVE Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect Compose Images
        run: docker compose -f ops/docker/compose.yml config --images | sort -u > trivy-images.txt

      - name: Review Infrastructure Images
        shell: bash
        run: |
          set -euo pipefail

          trivy_image="aquasec/trivy:0.68.2"
          trivy_cache_dir="${PWD}/.trivy-cache"

          mkdir -p "$trivy_cache_dir"
          docker pull "$trivy_image"

          {
            echo "## Infrastructure Image CVE Review"
            echo
            echo "Reviewed pinned images from ops/docker/compose.yml. High and critical findings are advisory and attached as a workflow artifact so upstream vendor CVEs do not block repository changes."
            echo
            echo "Images scanned:"
          } >> "$GITHUB_STEP_SUMMARY"

          : > trivy-image-review.log

          while IFS= read -r image; do
            if [ -z "$image" ]; then
              continue
            fi

            echo "- $image" >> "$GITHUB_STEP_SUMMARY"

            {
              echo
              echo "=== $image ==="
              docker run --rm \
                -v "$trivy_cache_dir:/root/.cache/" \
                "$trivy_image" image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --format table \
                --exit-code 0 \
                --no-progress \
                "$image"
            } | tee -a trivy-image-review.log
          done < trivy-images.txt

      - name: Upload Infrastructure Image Review
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-review
          path: trivy-image-review.log
