name: security-hygiene

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose
        run: docker compose -f ops/docker/compose.yml config

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"

  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:18.3-alpine3.23
          - valkey/valkey:9.0.3-alpine3.23
          - quay.io/keycloak/keycloak:26.5.7
          - ghcr.io/get-convex/convex-backend:9e188cd84ef96146ee101bc95e6365ca35871e4a
          - ghcr.io/get-convex/convex-dashboard:9e188cd84ef96146ee101bc95e6365ca35871e4a
          - otel/opentelemetry-collector-contrib:0.149.0
          - prom/prometheus:v3.11.0
          - grafana/loki:3.7.1
          - grafana/grafana:12.4.2
          - grafana/tempo:2.7.2
          - oryd/keto:v0.13.0
          - unleashorg/unleash-server:6.12
          - getmeili/meilisearch:v1.41.0
          - ghcr.io/novuhq/novu/api:3.14.0
          - ghcr.io/openmeterio/openmeter:v1.6
          - ghcr.io/postalserver/postal:3.3.4
          - glitchtip/glitchtip:6
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
