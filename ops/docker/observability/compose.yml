services:
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.151.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - 127.0.0.1:${OTEL_COLLECTOR_PORT_GRPC:-4317}:4317
      - 127.0.0.1:${OTEL_COLLECTOR_PORT_HTTP:-4318}:4318
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.11.3-distroless
    depends_on:
      otel-collector:
        condition: service_started
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
      ]
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    container_name: loki
    image: grafana/loki:3.7.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - 127.0.0.1:${LOKI_PORT:-3100}:3100
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  grafana:
    container_name: grafana
    image: grafana/grafana:13.0.1
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_AUTH_ANONYMOUS_ENABLED: false
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana

  tempo:
    container_name: tempo
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - 127.0.0.1:${TEMPO_PORT:-3200}:3200
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  glitchtip:
    container_name: glitchtip
    image: glitchtip/glitchtip:6
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      VALKEY_URL: ${GLITCHTIP_VALKEY_URL:-redis://valkey:6379}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@localhost}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      ENABLE_ADMIN: ${GLITCHTIP_ENABLE_ADMIN:-False}
      ENABLE_OPENAPI: ${GLITCHTIP_ENABLE_OPENAPI:-False}
      GLITCHTIP_ENABLE_LOGS: ${GLITCHTIP_ENABLE_LOGS:-False}
      GLITCHTIP_ENABLE_UPTIME: ${GLITCHTIP_ENABLE_UPTIME:-False}
      SERVER_ROLE: all_in_one
      PORT: 8000
    ports:
      - 127.0.0.1:${GLITCHTIP_PORT:-8001}:8000
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  grafana_data:
  glitchtip_uploads:
  loki_data:
  prometheus_data:
  tempo_data:
