services:
  kong:
    container_name: kong
    image: kong:3.9.1
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /tmp/kong.rendered.yml
      KONG_BACKEND_API_UPSTREAM_HOST: host.docker.internal
      KONG_BACKEND_API_UPSTREAM_PORT: ${SUBSCRIBER_JOURNEY_API_PORT:-3010}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
      KONG_ADMIN_GUI_URL: ${KONG_ADMIN_GUI_URL:-http://localhost:18002}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed \
          -e "s#__KONG_BACKEND_API_UPSTREAM_HOST__#$$KONG_BACKEND_API_UPSTREAM_HOST#g" \
          -e "s#__KONG_BACKEND_API_UPSTREAM_PORT__#$$KONG_BACKEND_API_UPSTREAM_PORT#g" \
          /etc/kong/kong.yml > /tmp/kong.rendered.yml
        exec /docker-entrypoint.sh kong docker-start
    ports:
      - 127.0.0.1:${KONG_PROXY_PORT:-8000}:8000
      - 127.0.0.1:${KONG_PROXY_TLS_PORT:-8443}:8443
      - 127.0.0.1:${KONG_ADMIN_API_PORT:-18001}:8001
      - 127.0.0.1:${KONG_ADMIN_API_TLS_PORT:-18444}:8444
      - 127.0.0.1:${KONG_ADMIN_GUI_PORT:-18002}:8002
      - 127.0.0.1:${KONG_ADMIN_GUI_TLS_PORT:-18445}:8445
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro

  vault:
    container_name: vault
    image: hashicorp/vault:2.0.0
    command: server
    environment:
      SKIP_SETCAP: "1"
      VAULT_ADDR: ${VAULT_ADDR:-http://127.0.0.1:8200}
    ports:
      - 127.0.0.1:${VAULT_PORT:-8200}:8200
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file

volumes:
  vault_data:
