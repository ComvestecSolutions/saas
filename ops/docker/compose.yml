name: comvestec-vendor-infra

include:
  - observability/compose.yml
  - identity/compose.yml
  - feature-flags/compose.yml
  - search/compose.yml
  - messaging/compose.yml
  - metering/compose.yml
  - analytics/compose.yml
  - security/compose.yml

services:
  postgres:
    container_name: postgres
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/18/docker}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres-bootstrap:
    container_name: postgres-bootstrap
    image: postgres:18.3-alpine3.23
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      CONVEX_POSTGRES_URL: ${CONVEX_POSTGRES_URL}
      CONVEX_INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-comvestec-foundation}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KETO_DSN: ${KETO_DSN}
      UNLEASH_DATABASE_URL: ${UNLEASH_DATABASE_URL}
      OPENMETER_POSTGRES_URL: ${OPENMETER_POSTGRES_URL}
      GLITCHTIP_DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        extract_database_name() {
          printf '%s' "$$1" | sed -E 's#.*/([^/?]+)(\?.*)?$$#\1#'
        }
        convex_database_name() {
          printf '%s' "$$1" | tr '-' '_'
        }
        for database in \
          "$$(convex_database_name "$$CONVEX_INSTANCE_NAME")" \
          "$$KEYCLOAK_DB_NAME" \
          "$$(extract_database_name "$$KETO_DSN")" \
          "$$(extract_database_name "$$UNLEASH_DATABASE_URL")" \
          "$$(extract_database_name "$$OPENMETER_POSTGRES_URL")" \
          "$$(extract_database_name "$$GLITCHTIP_DATABASE_URL")"; do
          if [ -z "$$database" ] || [ "$$database" = "$$PGDATABASE" ]; then
            continue
          fi
          existing="$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$database'")"
          if [ "$$existing" != "1" ]; then
            psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$database\""
          fi
        done
    restart: "no"

  valkey:
    container_name: valkey
    image: valkey/valkey:9.0.4-trixie
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - 127.0.0.1:${VALKEY_PORT:-6379}:6379
    volumes:
      - valkey_data:/data

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.6.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /opt/keycloak/data/import
        sed "s|__KEYCLOAK_CLIENT_SECRET__|$$KEYCLOAK_CLIENT_SECRET|g" \
          /opt/keycloak/data/import-template/realm-export.json \
          > /opt/keycloak/data/import/realm-export.json
        exec /opt/keycloak/bin/kc.sh start-dev \
          --import-realm \
          --http-port=8080 \
          --http-management-port=9000
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
      - 127.0.0.1:9000:9000
    volumes:
      - ./identity/keycloak/realm-export.json:/opt/keycloak/data/import-template/realm-export.json:ro

  convex-backend:
    container_name: convex-backend
    image: ghcr.io/get-convex/convex-backend:4499dd4fd7f2148687a7774599c613d052950f46
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-comvestec-foundation}
      POSTGRES_URL: ${CONVEX_POSTGRES_URL}
      POSTGRES_URL_INTERNAL: ${POSTGRES_URL_INTERNAL}
      DO_NOT_REQUIRE_SSL: 1
      CONVEX_CLOUD_ORIGIN: ${CONVEX_SELF_HOSTED_URL:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SELF_HOSTED_SITE_URL:-http://127.0.0.1:3211}
      CONVEX_SELF_HOSTED_URL: ${CONVEX_SELF_HOSTED_URL:-http://127.0.0.1:3210}
      CONVEX_SELF_HOSTED_SITE_URL: ${CONVEX_SELF_HOSTED_SITE_URL:-http://127.0.0.1:3211}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY}
      KEYCLOAK_BASE_URL_INTERNAL: ${KEYCLOAK_BASE_URL_INTERNAL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-comvestec}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-saas-platform}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN}
      POLAR_API_URL: ${POLAR_API_URL:-https://api.polar.sh}
      VALKEY_URL_INTERNAL: ${VALKEY_URL_INTERNAL:-redis://valkey:6379}
      KETO_READ_URL_INTERNAL: ${KETO_READ_URL_INTERNAL:-http://ory-keto:4466}
      KETO_WRITE_URL_INTERNAL: ${KETO_WRITE_URL_INTERNAL:-http://ory-keto:4467}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - 127.0.0.1:3210:3210
      - 127.0.0.1:3211:3211
    volumes:
      - convex_data:/convex/data

  convex-dashboard:
    container_name: convex-dashboard
    image: ghcr.io/get-convex/convex-dashboard:4499dd4fd7f2148687a7774599c613d052950f46
    depends_on:
      convex-backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_SELF_HOSTED_URL:-http://127.0.0.1:3210}
    ports:
      - 127.0.0.1:${CONVEX_DASHBOARD_PORT:-6791}:6791

volumes:
  convex_data:
  postgres_data:
  valkey_data:
