name: comvestec-saas-foundation

services:
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comvestec}
      POSTGRES_USER: ${POSTGRES_USER:-comvestec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comvestec}
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/18/docker}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-comvestec} -d ${POSTGRES_DB:-comvestec}",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  valkey:
    image: valkey/valkey:9.0.3-alpine3.23
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - ${VALKEY_PORT:-6379}:6379
    volumes:
      - valkey_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command:
      [
        "start-dev",
        "--import-realm",
        "--http-port=8080",
        "--http-management-port=9000",
      ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-comvestec}
      KC_DB_USERNAME: ${POSTGRES_USER:-comvestec}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-comvestec}
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${KEYCLOAK_PORT:-8080}:8080
      - 9000:9000
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:9e188cd84ef96146ee101bc95e6365ca35871e4a
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-comvestec-foundation}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://comvestec:comvestec@postgres:5432/comvestec}
      DO_NOT_REQUIRE_SSL: 1
      CONVEX_CLOUD_ORIGIN: ${CONVEX_SELF_HOSTED_URL:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SELF_HOSTED_SITE_URL:-http://127.0.0.1:3211}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - 3210:3210
      - 3211:3211
    volumes:
      - convex_data:/convex/data

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:9e188cd84ef96146ee101bc95e6365ca35871e4a
    depends_on:
      convex-backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_SELF_HOSTED_URL:-http://127.0.0.1:3210}
    ports:
      - ${CONVEX_DASHBOARD_PORT:-6791}:6791

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.149.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - ${OTEL_COLLECTOR_PORT_GRPC:-4317}:4317
      - ${OTEL_COLLECTOR_PORT_HTTP:-4318}:4318
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.11.1-distroless
    depends_on:
      otel-collector:
        condition: service_started
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
      ]
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.7.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - ${LOKI_PORT:-3100}:3100
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:12.4.2
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_AUTH_ANONYMOUS_ENABLED: false
    ports:
      - ${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana

  tempo:
    image: grafana/tempo:2.8.3
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - ${TEMPO_PORT:-3200}:3200
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  ory-keto:
    image: oryd/keto:v0.14.0
    command: ["serve", "--config", "/etc/keto/config.yaml"]
    environment:
      DSN: ${KETO_DSN:-postgres://comvestec:comvestec@postgres:5432/comvestec?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${KETO_READ_PORT:-4466}:4466
      - ${KETO_WRITE_PORT:-4467}:4467

  unleash:
    image: unleashorg/unleash-server:7.6.1
    environment:
      DATABASE_URL: ${UNLEASH_DATABASE_URL:-postgres://comvestec:comvestec@postgres:5432/comvestec?sslmode=disable}
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: ${UNLEASH_API_TOKEN:-default:development.unleash-insecure-api-token}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${UNLEASH_PORT:-4242}:4242

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meili-master-key}
      MEILI_ENV: ${MEILISEARCH_ENV:-development}
    ports:
      - ${MEILISEARCH_PORT:-7700}:7700
    volumes:
      - meilisearch_data:/meili_data

  novu:
    image: ghcr.io/novuhq/novu/api:3.14.0
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_ROOT_URL: ${NOVU_API_URL:-http://localhost:3100}
      MONGO_URL: ""
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    depends_on:
      - valkey
    ports:
      - ${NOVU_PORT:-3100}:3000

  openmeter:
    image: ghcr.io/openmeterio/openmeter:v1.0.0-beta.227
    environment:
      POSTGRES_URL: ${OPENMETER_POSTGRES_URL:-postgres://comvestec:comvestec@postgres:5432/comvestec?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${OPENMETER_PORT:-8889}:8888

  postal:
    image: ghcr.io/postalserver/postal:3.3.4
    environment:
      POSTAL_FNAME: ${POSTAL_FNAME:-Admin}
      POSTAL_LNAME: ${POSTAL_LNAME:-User}
      POSTAL_EMAIL: ${POSTAL_EMAIL:-admin@localhost}
    ports:
      - ${POSTAL_API_PORT:-5000}:5000
    volumes:
      - postal_data:/opt/postal/data

  glitchtip:
    image: glitchtip/glitchtip:6
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgres://comvestec:comvestec@postgres:5432/comvestec}
      VALKEY_URL: ${GLITCHTIP_VALKEY_URL:-redis://valkey:6379}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-local-env}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@localhost}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      ENABLE_ADMIN: ${GLITCHTIP_ENABLE_ADMIN:-False}
      ENABLE_OPENAPI: ${GLITCHTIP_ENABLE_OPENAPI:-False}
      GLITCHTIP_ENABLE_LOGS: ${GLITCHTIP_ENABLE_LOGS:-False}
      GLITCHTIP_ENABLE_UPTIME: ${GLITCHTIP_ENABLE_UPTIME:-False}
      SERVER_ROLE: all_in_one
      PORT: 8000
    ports:
      - ${GLITCHTIP_PORT:-8001}:8000
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  convex_data:
  grafana_data:
  glitchtip_uploads:
  loki_data:
  meilisearch_data:
  postal_data:
  postgres_data:
  prometheus_data:
  tempo_data:
  valkey_data:
