global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888, otel-collector:8889]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [keycloak:9000]

  - job_name: unleash
    metrics_path: /internal-backstage/prometheus
    static_configs:
      - targets: [unleash:4242]

  - job_name: meilisearch
    metrics_path: /metrics
    static_configs:
      - targets: [meilisearch:7700]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
